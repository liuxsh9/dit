services:
  core:
    image: ${CORE_IMAGE:-ghcr.io/liuxsh9/dit-core:latest}
    ports:
      - "${CORE_PORT:-8000}:8000"
    environment:
      DIT_SERVER_DATABASE_URL: "postgresql+asyncpg://dit:${DIT_DB_PASSWORD}@db:5432/dit"
      DIT_SERVER_DATA_DIR: "/data/dit"
      DIT_SERVER_SERVICE_TOKEN: "${SERVICE_TOKEN}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - core-data:/data/dit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dit
      POSTGRES_PASSWORD: "${DIT_DB_PASSWORD}"
      POSTGRES_DB: dit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dit"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  core-data:
  pg-data:
