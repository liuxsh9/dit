[project]
name = "dit"
version = "0.1.0"
description = "Git-like version control for LLM SFT training data"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyzstd>=0.16",
    "jcs>=0.2",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
dit = "dit.cli.main:app"

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.0",
    "alembic>=1.14",
    "prometheus-client>=0.21",
    "gunicorn>=22.0",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-tmp-files>=0.0.2",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
